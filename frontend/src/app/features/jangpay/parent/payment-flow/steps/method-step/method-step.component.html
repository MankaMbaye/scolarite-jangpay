<fieldset>
  <legend>
    <h2 class="step-title">Moyen de paiement</h2>
    <p class="step-hint">Choisissez comment vous souhaitez régler {{ formatXof(flow.amountToPay()) }}.</p>
  </legend>

  <div class="method-grid" role="radiogroup" aria-label="Moyen de paiement" aria-required="true">
    @for (method of flow.methods; track method.id) {
      <button
        type="button"
        class="method-card"
        role="radio"
        [attr.aria-checked]="flow.selectedMethodId() === method.id"
        [class.selected]="flow.selectedMethodId() === method.id"
        [style.--accent]="method.accent"
        (click)="select(method.id)"
      >
        <span class="icon">
          @if (method.logo) {
            <img class="method-logo" [src]="method.logo" [alt]="method.label" />
          } @else {
            @switch (iconKind(method.id)) {
              @case ('mobile') {
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="7" y="2.5" width="10" height="19" rx="2.2" stroke="currentColor" stroke-width="1.6"/><path d="M10.5 18.2h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M9 8.5c1.7-1.6 4.3-1.6 6 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M10.3 10.8c.9-.8 2.5-.8 3.4 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              }
              @case ('card') {
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="2.5" y="5.5" width="19" height="13" rx="2.2" stroke="currentColor" stroke-width="1.6"/><path d="M2.5 9.5h19" stroke="currentColor" stroke-width="1.6"/><path d="M6 14.5h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
              }
              @case ('cash') {
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="2.5" y="6" width="19" height="12" rx="2" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M5.5 8v0M18.5 16v0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              }
            }
          }
        </span>
        <span class="text">
          <span class="name">{{ method.label }}</span>
          <span class="desc">{{ method.description }}</span>
        </span>
        <span class="check" [class.checked]="flow.selectedMethodId() === method.id" aria-hidden="true">
          @if (flow.selectedMethodId() === method.id) {
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M3.5 8.5 6.5 11.5 12.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          }
        </span>
      </button>
    }
  </div>

  @if (flow.attemptedAdvance() && !flow.selectedMethodId()) {
    <p class="field-error" role="alert">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.5"/><path d="M6 6l4 4M10 6l-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      Choisissez un moyen de paiement pour continuer.
    </p>
  }
</fieldset>
